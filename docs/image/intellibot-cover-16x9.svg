<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071311"/>
      <stop offset=".52" stop-color="#10231f"/>
      <stop offset="1" stop-color="#07100f"/>
    </linearGradient>
    <radialGradient id="halo" cx=".76" cy=".47" r=".48">
      <stop offset="0" stop-color="#a7eadb" stop-opacity=".34"/>
      <stop offset=".32" stop-color="#80cdbb" stop-opacity=".13"/>
      <stop offset="1" stop-color="#80cdbb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#96d9c8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#96d9c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ca994"/>
      <stop offset=".42" stop-color="#b8f4e7"/>
      <stop offset=".7" stop-color="#78c6b2"/>
      <stop offset="1" stop-color="#d7fff7"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#f9fcfa"/>
      <stop offset=".55" stop-color="#d9e2df"/>
      <stop offset="1" stop-color="#a5b9b4"/>
    </linearGradient>
    <linearGradient id="panelShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d3cf"/>
      <stop offset="1" stop-color="#748b85"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#040a09"/>
      <stop offset=".64" stop-color="#0e1715"/>
      <stop offset="1" stop-color="#263a35"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#4d927f" stop-opacity=".18"/>
      <stop offset=".28" stop-color="#8bdfca"/>
      <stop offset=".52" stop-color="#d4fff5"/>
      <stop offset=".76" stop-color="#63b69f"/>
      <stop offset="1" stop-color="#9ae7d5" stop-opacity=".18"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#d6f5ed" opacity=".13"/>
    </pattern>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#b4eadd" stroke-opacity=".05"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="lineGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <ellipse cx="1390" cy="510" rx="660" ry="590" fill="url(#halo)"/>
  <ellipse cx="1390" cy="964" rx="540" ry="100" fill="url(#floor)"/>

  <!-- orbital / signal geometry -->
  <g fill="none" stroke="#a7eadb">
    <circle cx="1390" cy="500" r="356" stroke-opacity=".10"/>
    <circle cx="1390" cy="500" r="294" stroke-opacity=".08" stroke-dasharray="2 13"/>
    <circle cx="1390" cy="500" r="444" stroke-opacity=".045"/>
    <path d="M914 520C1097 409 1560 322 1845 504" stroke-opacity=".09"/>
    <path d="M956 650C1181 780 1584 774 1812 592" stroke-opacity=".07"/>
  </g>
  <g fill="#b9f5e7">
    <circle cx="1046" cy="470" r="4" opacity=".5"/>
    <circle cx="1770" cy="478" r="5" opacity=".58"/>
    <circle cx="1664" cy="727" r="3.5" opacity=".42"/>
    <circle cx="1153" cy="706" r="3" opacity=".4"/>
  </g>

  <!-- flowing signal ribbon -->
  <g fill="none" stroke-linecap="round">
    <path d="M940 823C1102 684 1090 919 1268 807C1435 702 1472 856 1695 664"
          stroke="#8ee5d1" stroke-opacity=".13" stroke-width="56" filter="url(#soft)"/>
    <path d="M941 821C1102 684 1092 914 1268 806C1434 704 1474 853 1697 662"
          stroke="url(#ribbon)" stroke-width="18"/>
    <path d="M950 819C1110 690 1096 902 1268 805C1434 711 1478 843 1689 668"
          stroke="#ecfff9" stroke-opacity=".72" stroke-width="2.4"/>
    <path d="M1042 1002C1167 916 1314 946 1421 1014C1512 1072 1645 1067 1761 985"
          stroke="#87d8c4" stroke-opacity=".14" stroke-width="34" filter="url(#soft)"/>
    <path d="M1042 1002C1168 917 1315 946 1422 1014C1513 1072 1646 1067 1762 985"
          stroke="#9fe8d7" stroke-opacity=".35" stroke-width="4"/>
  </g>

  <!-- robot figure -->
  <g filter="url(#soft)" opacity=".38">
    <ellipse cx="1378" cy="814" rx="285" ry="338" fill="#07100e"/>
  </g>

  <!-- raised arm -->
  <g>
    <path d="M1168 696C1081 669 1027 589 1056 505C1071 460 1119 433 1165 449C1209 464 1231 514 1214 558L1186 637"
          fill="none" stroke="url(#ivory)" stroke-width="72" stroke-linecap="round"/>
    <path d="M1059 505C1045 463 1076 424 1118 415C1148 409 1175 422 1189 446"
          fill="none" stroke="#f8fbfa" stroke-width="54" stroke-linecap="round"/>
    <path d="M1060 487C1061 462 1077 444 1102 439" fill="none" stroke="#596b67" stroke-width="10" stroke-linecap="round" opacity=".34"/>
    <g transform="translate(1090 398) rotate(-17)">
      <path d="M-25 5C-13-20 19-28 40-10L55 22L35 53L-7 52L-31 31Z" fill="url(#ivory)"/>
      <path d="M-12 14L10 1M-8 29L21 9M2 43L35 20" stroke="#72847f" stroke-width="4" stroke-linecap="round" opacity=".5"/>
    </g>
  </g>

  <!-- torso -->
  <g>
    <path d="M1195 612L1558 612L1630 797L1533 923L1253 926L1155 806Z" fill="url(#ivory)"/>
    <path d="M1195 612L1378 648L1262 918L1155 806Z" fill="url(#panelShade)" opacity=".28"/>
    <path d="M1558 612L1378 648L1519 916L1630 797Z" fill="#ffffff" opacity=".18"/>
    <path d="M1298 610L1378 654L1458 610L1422 588L1334 588Z" fill="#bfd0cb"/>
    <path d="M1264 706L1494 706L1462 823L1297 823Z" fill="#eef4f2"/>
    <path d="M1288 722L1470 722" stroke="#879a94" stroke-width="3" opacity=".24"/>
    <circle cx="1378" cy="775" r="6" fill="#8ee5d1" opacity=".75"/>
  </g>

  <!-- lowered arm -->
  <path d="M1588 681C1642 700 1674 758 1664 814L1635 923" fill="none" stroke="url(#ivory)" stroke-width="68" stroke-linecap="round"/>
  <path d="M1627 915L1632 974" stroke="#f7fbfa" stroke-width="48" stroke-linecap="round"/>

  <!-- neck / head -->
  <path d="M1328 562H1426L1446 619H1309Z" fill="#80938d"/>
  <path d="M1339 573H1418L1432 611H1325Z" fill="#d9e4e0"/>
  <g>
    <path d="M1218 365L1295 275L1445 254L1543 350L1539 487L1453 577L1305 582L1210 490Z" fill="url(#ivory)"/>
    <path d="M1218 365L1295 275L1351 333L1278 527L1210 490Z" fill="#ffffff" opacity=".15"/>
    <path d="M1445 254L1543 350L1539 487L1455 576L1429 446Z" fill="#738a84" opacity=".34"/>
    <path d="M1255 404L1312 344L1490 329L1520 431L1461 500L1324 506L1258 454Z" fill="url(#visor)"/>
    <path d="M1276 401L1322 354L1477 343" fill="none" stroke="#b9d2cc" stroke-width="3" opacity=".24"/>
    <g fill="#cafff2" filter="url(#tinyGlow)">
      <rect x="1333" y="399" width="30" height="14" rx="7"/>
      <rect x="1441" y="399" width="30" height="14" rx="7"/>
    </g>
    <path d="M1372 467C1398 482 1424 482 1450 466" fill="none" stroke="#8ee5d1" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <path d="M1297 275L1351 333L1445 254" fill="none" stroke="#ffffff" stroke-width="2.2" opacity=".5"/>
    <path d="M1351 333L1278 527M1351 333L1429 446" stroke="#8a9c96" stroke-width="2" opacity=".28"/>
  </g>

  <!-- spark / signal node -->
  <g transform="translate(1668 300)">
    <circle r="34" fill="#b9f5e7" opacity=".12" filter="url(#soft)"/>
    <circle r="7" fill="#d5fff5" filter="url(#tinyGlow)"/>
    <path d="M0-69V-29M0 29V69M-69 0H-29M29 0H69" stroke="#c9f8ed" stroke-width="2.2" opacity=".55"/>
    <path d="M-44-44L-22-22M22 22L44 44M44-44L22-22M-22 22L-44 44" stroke="#a9ebdc" stroke-width="1.4" opacity=".32"/>
  </g>

  <!-- brand + typography -->
  <g transform="translate(132 102)">
    <g transform="scale(2.25)">
      <polygon fill="#e9efed" points="5.59,8.59 5.59,12.43 9.17,16.73 12.6,11.24 9.43,8.59 5.59,8.59"/>
      <polygon fill="#e9efed" points="15.61,24.45 19.74,29.41 26.41,29.41 26.41,22.74 21.01,18.24 15.61,24.45"/>
      <polygon fill="#91d7cd" points="5.59,25.46 5.59,29.41 9.27,29.41 26.41,9.41 26.41,2.59 19.88,2.59 5.59,25.46"/>
    </g>
    <text x="92" y="42" fill="#eef4f2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="600" letter-spacing=".4">IntelliBot</text>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="134" y="328" fill="#9fe8d7" font-size="18" font-weight="500" letter-spacing="5">EMBODIED INTELLIGENCE</text>
    <text x="128" y="444" fill="#f4faf8" font-size="102" font-weight="500" letter-spacing="-4">Language,</text>
    <text x="128" y="550" fill="#f4faf8" font-size="102" font-weight="500" letter-spacing="-4">rendered in</text>
    <text x="128" y="656" fill="#91d7cd" font-size="102" font-weight="500" letter-spacing="-4">motion.</text>
    <text x="134" y="734" fill="#bdd4ce" font-size="25" font-weight="400" letter-spacing="1.2">对话 · 表情 · 动作 · 仿真</text>
  </g>

  <path d="M134 804H760" stroke="#b9f5e7" stroke-opacity=".18"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#89aaa2" font-size="17" letter-spacing="2.2">
    <text x="134" y="849">CONVERSATION</text>
    <text x="382" y="849">EXPRESSION</text>
    <text x="598" y="849">ROBOTIC MOTION</text>
  </g>
  <g fill="#91d7cd">
    <circle cx="116" cy="842" r="4"/>
    <circle cx="364" cy="842" r="4" opacity=".7"/>
    <circle cx="580" cy="842" r="4" opacity=".48"/>
  </g>

  <!-- fine technical markings -->
  <g fill="none" stroke="#b9f5e7" stroke-opacity=".23">
    <path d="M84 95H108M96 83V107"/>
    <path d="M1782 936H1836M1809 909V963"/>
    <path d="M1678 74H1748M1713 39V109"/>
  </g>
</svg>
