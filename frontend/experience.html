<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IntelliBot 独立体验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f0f0;color:#232733;font:16px system-ui}main{max-width:1180px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:24px}.layout{display:grid;grid-template-columns:310px 1fr;gap:24px}.panel{padding:24px;background:white;border-radius:18px}label{display:block;margin:14px 0}input{display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #bbc1cb;border-radius:8px}button,a.link{padding:10px 14px;margin:5px 5px 5px 0;border:0;border-radius:8px;background:#243c65;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}.stage{height:600px;position:relative;overflow:hidden;border-radius:18px;background:#e6e9ed}.robofx{position:absolute;inset:0;--robofx-top:60px}.robofx canvas{display:block;width:100%;height:100%}.message{min-height:45px;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#596473}.actions{margin-top:14px}[hidden]{display:none!important}@media(max-width:750px){.layout{grid-template-columns:1fr}.stage{height:450px}}:focus-visible{outline:3px solid #e29b30}
</style>
<script type="importmap">{"imports":{"three":"./lib/three/three.module.js","three/addons/":"./lib/three/addons/"}}</script></head>
<body><main><header><h1>IntelliBot · 独立机器人体验</h1><span id="identity">尚未登录</span></header>
<p>每个页面独立播放动作。当前使用模型自带动画，不连接真实硬件。</p>
<div class="layout"><section class="panel"><form id="auth-form"><h2>注册 / 登录</h2>
<label>用户名<input id="username" autocomplete="username" minlength="3" maxlength="24" required pattern="[A-Za-z0-9_]{3,24}"></label>
<label>密码<input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="64" required></label>
<label>昵称（注册可选）<input id="display-name" autocomplete="nickname" maxlength="32"></label>
<button id="login" type="submit">登录</button><button id="register" type="button">注册</button></form>
<div id="controls" hidden><h2>动作库</h2><div id="actions" class="actions"></div><button id="logout">退出登录</button><p><small>播放状态：<span id="playback">等待模型加载</span></small></p></div>
<p id="message" class="message" role="status" aria-live="polite"></p><small>此页用于全链路联调，正式登录界面由前端同学接入。</small></section>
<section class="stage" aria-label="独立机器人模型"></section></div></main>
<script type="module" src="./js/robot3d.js"></script><script type="module" src="./js/experience.js"></script></body></html>
